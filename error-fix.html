
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error Fix | Oops!</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="theme.css">

  <style>
    :root {
      --purple: #6c63ff;
      --pink: #ff7a90;
      --mint: #42c9b5;
      --ink: #302b49;
      --muted: #716c83;
      --paper: #ffffff;
      --bg: #faf9ff;
      --border: #e8e4f3;
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 10% 0%, #eeeaff 0, transparent 36%),
        radial-gradient(ellipse at 95% 8%, #fff0f4 0, transparent 30%),
        var(--bg);
      line-height: 1.7;
    }

    button, input, textarea { font: inherit; }

    button, a { -webkit-tap-highlight-color: transparent; }

    a { color: var(--purple); }

    button:focus-visible,
    a:focus-visible,
    textarea:focus-visible {
      outline: 3px solid #d97706;
      outline-offset: 3px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 76px;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px max(4%, calc((100% - 1200px)/2));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    .logo {
      flex: 0 0 auto;
      font-family: "Lexend", sans-serif;
      font-size: 28px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -1.2px;
      color: var(--pink);
      text-decoration: none;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1 1 500px;
      gap: 6px;
      flex-wrap: wrap;
    }

    nav a {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 8px 12px;
      border-radius: 999px;
      color: #514b68;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    nav a:hover,
    nav a[aria-current="page"] {
      background: #eeecff;
      color: var(--pink);
    }

    #mode {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 11px 20px;
      border: 1px solid var(--pink);
      border-radius: 999px;
      background: var(--pink);
      color: white;
      font-weight: 800;
      cursor: pointer;
      margin: 0;
      transition: transform .18s, filter .18s;
    }

    #mode:hover {
      filter: brightness(.96);
      transform: translateY(-1px);
    }

    main {
      width: min(1100px, 92%);
      margin: 34px auto 60px;
    }

    .panel {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(18px, 3vw, 30px);
      margin: 20px 0;
      box-shadow: 0 12px 34px #302b490c;
    }

    h1, h2, h3 {
      font-family: "Lexend", "Be Vietnam Pro", sans-serif;
      line-height: 1.3;
    }

    h1 {
      font-size: clamp(30px, 5vw, 44px);
      margin: 8px 0 18px;
      letter-spacing: -1px;
    }

    .intro { color: var(--muted); }

    label {
      display: block;
      font-weight: 700;
      margin: 20px 0 8px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 150px;
      padding: 14px 16px;
      border: 1px solid #d8d2ed;
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      resize: vertical;
    }

    textarea::placeholder { color: #888398; }

    .note {
      color: var(--muted);
      font-size: 13px;
      margin-top: 10px;
    }

    #check-form button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 46px;
      padding: 11px 20px;
      border: 1px solid var(--purple);
      border-radius: 999px;
      background: var(--purple);
      color: white;
      font-weight: 800;
      cursor: pointer;
      margin: 10px 8px 0 0;
      transition: transform .18s, filter .18s;
    }

    #check-form button:hover {
      filter: brightness(.96);
      transform: translateY(-1px);
    }

    #result {
      margin-top: 20px;
      padding: 18px;
      border-radius: 16px;
      background: #f3f0ff;
      border: 1px solid var(--border);
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    body.accessible {
      background: #fff !important;
      color: #111 !important;
      font-size: 19px;
      line-height: 1.9;
    }

    body.accessible header,
    body.accessible .panel,
    body.accessible #result {
      background: #fff !important;
      color: #111 !important;
      border: 2px solid #111 !important;
      box-shadow: none !important;
    }

    body.accessible nav a,
    body.accessible .logo,
    body.accessible a {
      color: #111 !important;
      text-decoration: underline;
    }

    body.accessible textarea {
      background: #fff;
      color: #111;
      border: 2px solid #111;
    }

    body.accessible #mode,
    body.accessible #check-form button {
      background: #111 !important;
      color: #fff !important;
      border: 2px solid #111 !important;
    }

    body.accessible .intro,
    body.accessible .note {
      color: #333 !important;
    }

    @media (max-width: 820px) {
      header { justify-content: center; }
      nav { order: 3; flex-basis: 100%; }
    }

    @media (max-width: 600px) {
      header {
        position: static;
        padding: 14px 4%;
        gap: 12px;
      }

      .logo { font-size: 26px; }

      nav { gap: 2px; }

      nav a {
        font-size: 12px;
        padding: 7px 9px;
      }

      main {
        width: 94%;
        margin: 20px auto 40px;
      }

      .panel {
        padding: 19px;
        border-radius: 20px;
      }

      #check-form button {
        width: 100%;
        margin-right: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">Oops!</a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="error-fix.html" aria-current="page">Error Fix</a>
      <a href="grammar.html">Grammar</a>
      <a href="vocabulary.html">Vocabulary</a>
      <a href="progress.html">Progress</a>
      <a href="roadmap.html">Roadmap</a>
    </nav>
    <button type="button" id="mode" aria-pressed="false">
      Accessible Mode
    </button>
  </header>

  <main>
    <section class="panel">
      <h1>Error Fix — Check Your English</h1>
      <p class="intro">
        Enter an English sentence to review its grammar and receive feedback.
      </p>

      <form id="check-form">
        <label for="sentence">Your English sentence</label>
        <textarea id="sentence" required
          placeholder="Example: She go to school every day."
          aria-describedby="check-note"></textarea>
        <p class="note" id="check-note">
          This starter version checks a few common patterns. It cannot reliably
          judge every English sentence yet.
        </p>
        <button type="submit">Check my sentence</button>
      </form>

      <div id="result" role="status" aria-live="polite">
        Your feedback will appear here.
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("check-form");
    const sentence = document.getElementById("sentence");
    const result = document.getElementById("result");

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      const text = sentence.value.trim();

      if (!text) {
        result.textContent = "Please enter an English sentence.";
        return;
      }

      const patterns = [
        {
          regex: /\bshe go\b/i,
          correction: "She goes",
          explanation: "In the present simple, use goes with he, she and it."
        },
        {
          regex: /\bhe go\b/i,
          correction: "He goes",
          explanation: "In the present simple, use goes with he, she and it."
        },
        {
          regex: /\bi am agree\b/i,
          correction: "I agree",
          explanation: "Agree is a verb, so we normally say I agree, not I am agree."
        },
        {
          regex: /\bshe don't\b/i,
          correction: "She doesn't",
          explanation: "Use doesn't with he, she and it in present-simple negatives."
        },
        {
          regex: /\bhe don't\b/i,
          correction: "He doesn't",
          explanation: "Use doesn't with he, she and it in present-simple negatives."
        }
      ];

      const found = patterns.find(item => item.regex.test(text));

      if (found) {
        const corrected = text.replace(found.regex, found.correction);
        result.replaceChildren();

        const heading = document.createElement("strong");
        heading.textContent = "A possible error was found";
        const correctedLine = document.createElement("p");
        correctedLine.textContent = "Suggested correction: " + corrected;
        const explanation = document.createElement("p");
        explanation.textContent = "Explanation: " + found.explanation;

        result.append(heading, correctedLine, explanation);
      } else {
        result.textContent =
          "This starter checker did not detect one of its listed error patterns. " +
          "That does not prove the sentence is correct. A more complete language " +
          "checker is needed to assess arbitrary sentences reliably.";
      }
    });

    document.getElementById("mode").addEventListener("click", function() {
      const enabled = document.body.classList.toggle("accessible");
      this.setAttribute("aria-pressed", String(enabled));
      this.textContent = enabled ? "Normal Mode" : "Accessible Mode";
    });
  </script>
</body>
</html>
