
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="theme.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error Fix | Oops!</title>
 
<style>
  /* Oops! Error Fix — shared visual system */
  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    background: #faf9ff;
    color: #302b49;
    font-family: "Be Vietnam Pro", system-ui, sans-serif;
    line-height: 1.7;
  }

  header {
    background: #ffffffed;
    border-bottom: 1px solid #e8e4f3;
    padding: 18px 3%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .logo {
    font-family: "Lexend", "Be Vietnam Pro", sans-serif;
    color: #6c63ff;
    font-size: 32px;
    font-weight: 800;
    text-decoration: none;
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  nav a {
    color: #514777;
    text-decoration: none;
    font-weight: 500;
  }

  nav a:hover,
  nav a[aria-current="page"] {
    color: #6c63ff;
    text-decoration: underline;
    text-underline-offset: 5px;
    font-weight: 800;
  }

  #mode {
    margin: 0;
    padding: 12px 20px;
    border: 1px solid #6c63ff;
    border-radius: 999px;
    background: #6c63ff;
    color: #fff;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
  }

  main {
    width: min(1100px, 92%);
    margin: 36px auto 60px;
  }

  .panel {
    background: #fff;
    border: 1px solid #e8e4f3;
    border-radius: 22px;
    padding: 28px;
    box-shadow: 0 10px 30px #302b490b;
  }

  h1,
  h2,
  h3 {
    font-family: "Lexend", "Be Vietnam Pro", sans-serif;
    line-height: 1.3;
  }

  h1 {
    margin-top: 0;
    font-size: clamp(30px, 5vw, 44px);
  }

  .intro {
    color: #716c83;
  }

  label {
    display: block;
    margin: 20px 0 8px;
    font-weight: 800;
  }

  textarea {
    display: block;
    width: 100%;
    min-height: 150px;
    padding: 14px 16px;
    border: 1px solid #d8cfee;
    border-radius: 14px;
    background: #fff;
    color: #302b49;
    font: inherit;
    resize: vertical;
  }

  .note {
    color: #716c83;
    font-size: 14px;
  }

  #check-form button {
    margin-top: 16px;
    padding: 12px 22px;
    border: 1px solid #6c63ff;
    border-radius: 999px;
    background: #6c63ff;
    color: #fff;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
  }

  #mode:hover,
  #check-form button:hover {
    filter: brightness(0.95);
    transform: translateY(-1px);
  }

  #result {
    margin-top: 24px;
    padding: 18px 22px;
    border: 1px solid #eeecff;
    border-radius: 16px;
    background: #f4f0ff;
    color: #302b49;
    overflow-wrap: anywhere;
  }

  button:focus-visible,
  a:focus-visible,
  textarea:focus-visible {
    outline: 3px solid #ff8c00;
    outline-offset: 4px;
  }

  /* Accessible Mode */
  body.accessible {
    background: #fff;
    color: #000;
    font-size: 19px;
    line-height: 1.9;
  }

  body.accessible header,
  body.accessible .panel,
  body.accessible #result {
    background: #fff;
    color: #000;
    border: 2px solid #000;
    box-shadow: none;
  }

  body.accessible .logo,
  body.accessible nav a,
  body.accessible .intro,
  body.accessible .note {
    color: #000;
  }

  body.accessible nav a {
    text-decoration: underline;
  }

  body.accessible textarea {
    background: #fff;
    color: #000;
    border: 2px solid #000;
  }

  body.accessible #mode,
  body.accessible #check-form button {
    background: #000;
    color: #fff;
    border: 2px solid #000;
  }

  body.accessible #result {
    background: #fff;
  }

  @media (max-width: 700px) {
    header {
      padding: 16px 5%;
    }

    nav {
      justify-content: flex-start;
      gap: 12px;
    }

    main {
      width: 94%;
      margin-top: 22px;
    }

    .panel {
      padding: 20px;
    }

    #mode {
      max-width: 100%;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }

    *,
    *::before,
    *::after {
      transition: none !important;
      animation: none !important;
    }
  }
</style>

</head>
<body>
  <header>
    <a class="logo" href="index.html">Oops!</a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="error-fix.html" aria-current="page">Error Fix</a>
      <a href="grammar.html">Grammar</a>
      <a href="vocabulary.html">Vocabulary</a>
      <a href="progress.html">Progress</a>
      <a href="roadmap.html">Roadmap</a>
    </nav>
    <button type="button" id="mode" aria-pressed="false">
      Accessible Mode
    </button>
  </header>

  <main>
    <section class="panel">
      <h1>Error Fix — Check Your English</h1>
      <p class="intro">
        Enter an English sentence to review its grammar and receive feedback.
      </p>

      <form id="check-form">
        <label for="sentence">Your English sentence</label>
        <textarea id="sentence" required
          placeholder="Example: She go to school every day."
          aria-describedby="check-note"></textarea>
        <p class="note" id="check-note">
          This starter version checks a few common patterns. It cannot reliably
          judge every English sentence yet.
        </p>
        <button type="submit">Check my sentence</button>
      </form>

      <div id="result" role="status" aria-live="polite">
        Your feedback will appear here.
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("check-form");
    const sentence = document.getElementById("sentence");
    const result = document.getElementById("result");

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      const text = sentence.value.trim();

      if (!text) {
        result.textContent = "Please enter an English sentence.";
        return;
      }

      const patterns = [
        {
          regex: /\bshe go\b/i,
          correction: "She goes",
          explanation: "In the present simple, use goes with he, she and it."
        },
        {
          regex: /\bhe go\b/i,
          correction: "He goes",
          explanation: "In the present simple, use goes with he, she and it."
        },
        {
          regex: /\bi am agree\b/i,
          correction: "I agree",
          explanation: "Agree is a verb, so we normally say I agree, not I am agree."
        },
        {
          regex: /\bshe don't\b/i,
          correction: "She doesn't",
          explanation: "Use doesn't with he, she and it in present-simple negatives."
        },
        {
          regex: /\bhe don't\b/i,
          correction: "He doesn't",
          explanation: "Use doesn't with he, she and it in present-simple negatives."
        }
      ];

      const found = patterns.find(item => item.regex.test(text));

      if (found) {
        const corrected = text.replace(found.regex, found.correction);
        result.replaceChildren();

        const heading = document.createElement("strong");
        heading.textContent = "A possible error was found";
        const correctedLine = document.createElement("p");
        correctedLine.textContent = "Suggested correction: " + corrected;
        const explanation = document.createElement("p");
        explanation.textContent = "Explanation: " + found.explanation;

        result.append(heading, correctedLine, explanation);
      } else {
        result.textContent =
          "This starter checker did not detect one of its listed error patterns. " +
          "That does not prove the sentence is correct. A more complete language " +
          "checker is needed to assess arbitrary sentences reliably.";
      }
    });

    document.getElementById("mode").addEventListener("click", function() {
      const enabled = document.body.classList.toggle("accessible");
      this.setAttribute("aria-pressed", String(enabled));
      this.textContent = enabled ? "Normal Mode" : "Accessible Mode";
    });
  </script>
</body>
</html>
