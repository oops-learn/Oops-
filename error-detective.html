
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error Detective | Oops!</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fc;
      color: #30243d;
      line-height: 1.6;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 18px 6%;
      background: white;
      border-bottom: 1px solid #eaddeb;
    }
    .logo {
      font-size: 30px;
      font-weight: 800;
      color: #30243d;
      text-decoration: none;
    }
    nav { display: flex; flex-wrap: wrap; gap: 16px; }
    nav a { color: #624674; }
    main { max-width: 850px; margin: 40px auto; padding: 0 20px; }
    .panel {
      background: white;
      padding: 28px;
      border: 1px solid #eeddec;
      border-radius: 20px;
    }
    .question {
      margin: 20px 0;
      padding: 18px;
      background: #faf3ff;
      border-radius: 12px;
    }
    label { display: block; margin: 12px 0; cursor: pointer; }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #67447b;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:focus-visible, a:focus-visible {
      outline: 3px solid #df78b0;
      outline-offset: 3px;
    }
    #feedback {
      margin-top: 20px;
      padding: 16px;
      background: #f7effa;
      border-radius: 12px;
    }
    body.accessible { background: white; color: black; font-size: 18px; }
    body.accessible .panel, body.accessible .question { border: 2px solid black; }
    body.accessible a { color: #00008b; }
    body.accessible button { background: black; color: white; }
    @media (max-width: 600px) {
      header { padding: 14px 5%; }
      .panel { padding: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">Oops!</a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="error-fix.html">Error Fix</a>
      <a href="error-detective.html" aria-current="page">Error Detective</a>
      <a href="grammar.html">Grammar</a>
      <a href="vocabulary.html">Vocabulary</a>
    </nav>
    <button type="button" id="mode" aria-pressed="false">
      Accessible Mode
    </button>
  </header>

  <main>
    <section class="panel">
      <h1>Error Detective</h1>
      <p>Find the grammatical mistake and choose the correct sentence.</p>

      <div class="question">
        <h2>Question 1 — Present Simple</h2>
        <p>Which sentence is correct?</p>
        <form id="quiz">
          <label>
            <input type="radio" name="answer" value="a" required>
            She go to school every day.
          </label>
          <label>
            <input type="radio" name="answer" value="b">
            She goes to school every day.
          </label>
          <label>
            <input type="radio" name="answer" value="c">
            She going to school every day.
          </label>
          <button type="submit">Check answer</button>
        </form>
      </div>

      <div id="feedback" role="status" aria-live="polite">
        Choose an answer to see the explanation.
      </div>
    </section>
  </main>

  <script>
    document.getElementById("quiz").addEventListener("submit", function(event) {
      event.preventDefault();
      const answer = new FormData(this).get("answer");
      const feedback = document.getElementById("feedback");

      if (answer === "b") {
        feedback.textContent =
          "Correct! With he, she or it in the present simple, add -s or -es to the verb. The correct sentence is: She goes to school every day.";
      } else {
        feedback.textContent =
          "Not quite. The correct answer is B: She goes to school every day. In the present simple, use goes with she.";
      }
    });

    document.getElementById("mode").addEventListener("click", function() {
      const enabled = document.body.classList.toggle("accessible");
      this.setAttribute("aria-pressed", String(enabled));
      this.textContent = enabled ? "Normal Mode" : "Accessible Mode";
    });
  </script>
</body>
</html>
